<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#EA8251',
                        secondary: '#9C4927',
                        cream: '#F2F0E4',
                        dark: '#1F2020'
                    }
                }
            }
        }
    </script>
    <style>
        .bg-primary-5  { background-color: rgba(234,130,81,0.05); }
        .bg-primary-10 { background-color: rgba(234,130,81,0.1); }
        .hover\:bg-primary-5:hover  { background-color: rgba(234,130,81,0.05); }
        .hover\:bg-primary-10:hover { background-color: rgba(234,130,81,0.1); }
        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .reply-indent { border-left: 2px solid #e5e7eb; padding-left: 1rem; margin-left: 0.5rem; }
        .avatar {
            width: 2rem; height: 2rem;
            border-radius: 9999px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 700;
            flex-shrink: 0;
        }
    </style>
</head>
<body class="bg-cream min-h-screen">

    <!-- Not logged in -->
    <div id="login-section" class="hidden min-h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-xl shadow-lg max-w-md w-full mx-4 text-center">
            <h1 class="text-2xl font-bold text-gray-800 mb-3">Foro</h1>
            <p class="text-gray-500 mb-6">Inicia sesión para acceder al foro.</p>
            <a href="/" class="inline-block px-6 py-2 bg-primary text-white rounded-lg hover:bg-secondary transition font-medium">
                Ir al Portal
            </a>
        </div>
    </div>

    <!-- Forum page -->
    <div id="forum-section" class="hidden">
        <!-- Nav -->
        <nav class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-30">
            <div class="max-w-2xl mx-auto px-4 h-14 flex items-center justify-between gap-3">
                <div class="flex items-center gap-3 min-w-0">
                    <a href="/" class="text-gray-400 hover:text-gray-600 shrink-0" title="Inicio">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                        </svg>
                    </a>
                    <span class="font-bold text-gray-800 text-lg shrink-0">Foro</span>
                    <select id="class-selector"
                            onchange="onClassChange()"
                            class="min-w-0 px-2 py-1 border border-gray-200 rounded-lg text-sm focus:ring-2 focus:ring-primary outline-none bg-gray-50 truncate max-w-[180px]">
                    </select>
                </div>
                <div class="flex items-center gap-3 shrink-0">
                    <span id="user-name" class="text-sm text-gray-500 hidden sm:inline truncate max-w-[120px]"></span>
                    <button onclick="logout()" class="text-gray-400 hover:text-gray-600 text-sm">Salir</button>
                </div>
            </div>
        </nav>

        <!-- Main content -->
        <main class="max-w-2xl mx-auto px-4 py-5 space-y-4">

            <!-- Post composer -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <!-- Collapsed trigger -->
                <button id="composer-trigger" onclick="openComposer()"
                        class="w-full flex items-center gap-3 px-5 py-4 text-left hover:bg-gray-50 transition">
                    <div class="avatar bg-primary-10 text-primary" id="composer-avatar">?</div>
                    <span class="text-gray-400 text-sm">Escribe algo para tu clase...</span>
                </button>
                <!-- Expanded composer -->
                <div id="composer-form" class="hidden px-5 pb-5 pt-2 border-t border-gray-100">
                    <input id="post-title" type="text" placeholder="Título (opcional)"
                           class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg mb-2 focus:ring-2 focus:ring-primary outline-none">
                    <textarea id="post-content" rows="4" placeholder="¿Qué quieres compartir con tu clase?"
                              class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg resize-none focus:ring-2 focus:ring-primary outline-none"></textarea>
                    <div class="flex justify-end gap-2 mt-3">
                        <button onclick="closeComposer()"
                                class="px-4 py-1.5 text-sm text-gray-600 hover:text-gray-800 rounded-lg transition">
                            Cancelar
                        </button>
                        <button onclick="submitPost()"
                                class="px-5 py-1.5 text-sm bg-primary hover:bg-secondary text-white font-medium rounded-lg transition">
                            Publicar
                        </button>
                    </div>
                </div>
            </div>

            <!-- Posts feed -->
            <div id="posts-container" class="space-y-3">
                <p class="text-center text-gray-400 text-sm py-6">Cargando...</p>
            </div>

            <!-- Load more -->
            <div id="load-more-container" class="hidden text-center pb-6">
                <button id="load-more-btn" onclick="loadMorePosts()"
                        class="px-6 py-2 text-sm text-gray-600 border border-gray-200 rounded-full hover:bg-white transition">
                    Cargar más publicaciones
                </button>
            </div>

            <!-- Empty state -->
            <div id="empty-state" class="hidden text-center py-12">
                <div class="text-4xl mb-3">💬</div>
                <p class="text-gray-500 text-sm">No hay publicaciones aún. ¡Sé el primero en escribir!</p>
            </div>

            <!-- No class state -->
            <div id="no-class-state" class="hidden text-center py-12">
                <div class="text-4xl mb-3">📚</div>
                <p class="text-gray-500 text-sm">No estás inscrito en ninguna clase.</p>
            </div>
        </main>
    </div>

    <!-- ======= Post Detail Modal ======= -->
    <div id="post-modal" class="hidden fixed inset-0 z-50 bg-black/50 overflow-y-auto">
        <div class="min-h-full flex items-start justify-center p-4 py-8">
            <div class="bg-white w-full max-w-2xl rounded-xl shadow-2xl">
                <!-- Modal header -->
                <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
                    <div class="flex items-center gap-2 min-w-0">
                        <span id="modal-class-badge"
                              class="px-2 py-0.5 bg-primary-10 text-secondary text-xs font-medium rounded-full truncate max-w-[200px]"></span>
                    </div>
                    <button onclick="closePostModal()" class="text-gray-400 hover:text-gray-600 ml-3 shrink-0">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>

                <!-- Post content -->
                <div id="modal-post-body" class="px-5 py-5">
                    <p class="text-center text-gray-400 text-sm">Cargando...</p>
                </div>

                <!-- Reply composer -->
                <div class="px-5 pb-3 border-t border-gray-100 pt-4">
                    <div class="flex gap-2">
                        <div class="avatar bg-primary-10 text-primary text-xs shrink-0 mt-0.5" id="modal-avatar">?</div>
                        <div class="flex-1">
                            <textarea id="modal-reply-input" rows="2"
                                      placeholder="Escribe una respuesta..."
                                      class="w-full px-3 py-2 text-sm border border-gray-200 rounded-lg resize-none focus:ring-2 focus:ring-primary outline-none"></textarea>
                            <div class="flex justify-end mt-1.5">
                                <button onclick="submitModalReply()"
                                        class="px-4 py-1.5 text-sm bg-primary hover:bg-secondary text-white font-medium rounded-lg transition">
                                    Responder
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Replies -->
                <div id="modal-replies" class="px-5 pb-5 border-t border-gray-100 pt-4">
                    <!-- Replies rendered here -->
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/forum.js"></script>
</body>
</html>
