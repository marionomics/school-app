<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#EA8251',
                        secondary: '#9C4927',
                        cream: '#F2F0E4',
                        dark: '#1F2020'
                    }
                }
            }
        }
    </script>
    <style>
        body { margin: 0; padding: 0; background: #1F2020; overflow: hidden; height: 100vh; font-family: 'Inter', system-ui, sans-serif; }
        #exam-frame { border: none; width: 100%; display: block; }
        #top-bar { height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #1F2020; border-bottom: 1px solid #333; color: #F2F0E4; font-family: system-ui, sans-serif; }
        #top-bar .title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #top-bar .timer { font-family: 'IBM Plex Mono', monospace, monospace; font-size: 14px; font-weight: 600; padding: 4px 12px; border-radius: 6px; }
        .timer-normal { background: rgba(234,130,81,0.15); color: #EA8251; }
        .timer-warning { background: rgba(239,68,68,0.2); color: #EF4444; animation: pulse-timer 1s infinite; }
        @keyframes pulse-timer { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
        #loading-screen { position: fixed; inset: 0; background: #1F2020; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; color: #F2F0E4; font-family: system-ui, sans-serif; }
        #loading-screen h2 { font-size: 20px; font-weight: 600; margin-bottom: 12px; }
        #loading-screen p { font-size: 13px; color: rgba(242,240,228,0.6); }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(234,130,81,0.2); border-top-color: #EA8251; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status-screen { display: none; position: fixed; inset: 0; background: #F2F0E4; z-index: 100; font-family: system-ui, sans-serif; }
        /* Preview banner */
        #preview-banner { display: none; height: 32px; background: #9C4927; color: #F2F0E4; font-family: system-ui, sans-serif; font-size: 12px; font-weight: 600; text-align: center; line-height: 32px; letter-spacing: 0.05em; }
        body.is-preview #preview-banner { display: block; }
        body.is-preview #exam-frame { height: calc(100vh - 48px - 32px); }
        body:not(.is-preview) #exam-frame { height: calc(100vh - 48px); }
    </style>
</head>
<body>

<!-- Loading screen -->
<div id="loading-screen">
    <div class="spinner"></div>
    <h2>Cargando examen...</h2>
    <p id="loading-msg">Verificando acceso</p>
</div>

<!-- Status screen (for errors, already submitted, inactive) -->
<div id="status-screen">
    <div class="flex items-center justify-center min-h-screen">
        <div class="text-center max-w-md p-8">
            <div id="status-icon" class="text-6xl mb-4"></div>
            <h2 id="status-title" class="text-xl font-bold text-gray-800 mb-2"></h2>
            <p id="status-msg" class="text-gray-600 mb-6"></p>
            <a href="/" class="inline-block px-6 py-3 bg-primary text-white rounded-lg font-medium hover:bg-secondary transition">
                Regresar al dashboard
            </a>
        </div>
    </div>
</div>

<!-- Top bar + iframe (hidden until ready) -->
<div id="exam-container" style="display:none;">
    <div id="preview-banner">👁 VISTA PREVIA — Las respuestas NO se guardarán ni calificarán</div>
    <div id="top-bar">
        <div class="title" id="exam-title-bar">Examen</div>
        <div class="flex items-center gap-3">
            <div id="timer-display" class="timer timer-normal" style="display:none;"></div>
            <button onclick="confirmExit()" class="text-gray-400 hover:text-white text-sm" title="Salir">✕</button>
        </div>
    </div>
    <iframe id="exam-frame" sandbox="allow-scripts allow-same-origin allow-modals allow-popups"></iframe>
</div>

<script>
// ── Config ──
const API_BASE = '/api';
const authToken = localStorage.getItem('authToken');
const assignmentId = parseInt(window.location.pathname.split('/exam/')[1]);

let examStatus = null;
let isPreview = false;
let timerInterval = null;
let timeRemainingSec = null;
let draftSaveInProgress = false;

// ── Auth check ──
if (!authToken || isNaN(assignmentId)) {
    window.location.href = '/';
}

// ── API helper ──
async function api(endpoint, options = {}) {
    const res = await fetch(`${API_BASE}${endpoint}`, {
        ...options,
        headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${authToken}`,
            ...(options.headers || {}),
        },
    });
    if (!res.ok) {
        const err = await res.json().catch(() => ({ detail: 'Error desconocido' }));
        throw new Error(err.detail || `Error ${res.status}`);
    }
    return res.json();
}

// ── Status screen ──
function showStatus(icon, title, msg) {
    document.getElementById('loading-screen').style.display = 'none';
    document.getElementById('status-icon').textContent = icon;
    document.getElementById('status-title').textContent = title;
    document.getElementById('status-msg').textContent = msg;
    document.getElementById('status-screen').style.display = 'block';
}

// ── Timer ──
function startTimer(seconds) {
    timeRemainingSec = seconds;
    const display = document.getElementById('timer-display');
    display.style.display = 'block';

    function updateTimer() {
        if (timeRemainingSec <= 0) {
            clearInterval(timerInterval);
            display.textContent = '00:00';
            display.className = 'timer timer-warning';
            // Auto-submit via postMessage to iframe
            document.getElementById('exam-frame').contentWindow.postMessage({ type: 'TIME_UP' }, '*');
            return;
        }
        const m = Math.floor(timeRemainingSec / 60);
        const s = timeRemainingSec % 60;
        display.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

        if (timeRemainingSec <= 300) {
            display.className = 'timer timer-warning';
        }
        timeRemainingSec--;
    }

    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);
}

// ── Draft save ──
async function saveDraft(draftData) {
    if (isPreview || draftSaveInProgress) return;
    draftSaveInProgress = true;
    try {
        await api(`/students/me/assignments/${assignmentId}/exam-draft`, {
            method: 'POST',
            body: JSON.stringify({ draft_json: draftData }),
        });
    } catch (e) {
        console.warn('Draft save failed:', e.message);
    } finally {
        draftSaveInProgress = false;
    }
}

// ── Submit ──
async function submitExam(receiptJson, score) {
    try {
        const result = await api(`/students/me/assignments/${assignmentId}/submit-online-exam`, {
            method: 'POST',
            body: JSON.stringify({ receipt_json: receiptJson, total_score: score }),
        });
        clearInterval(timerInterval);
        if (result.is_preview) {
            showStatus('👁', `Vista previa completada — ${result.score}/${result.max_points}`,
                'Esta fue una vista previa. No se registró ninguna calificación. Puedes regresar al panel.');
        } else {
            showStatus('✅', `Examen entregado — ${result.score}/${result.max_points}`,
                'Tu calificación ya está registrada. Puedes regresar al dashboard.');
        }
        document.getElementById('exam-container').style.display = 'none';
    } catch (e) {
        alert('❌ Error al entregar el examen: ' + e.message + '\n\nPor favor avisa a tu profesor AHORA con este mensaje de error para que pueda registrar tu calificación manualmente.');
    }
}

// ── Confirm exit ──
function confirmExit() {
    const msg = isPreview
        ? '¿Salir de la vista previa?'
        : '¿Salir del examen? Tu progreso guardado se mantendrá.';
    if (confirm(msg)) {
        window.location.href = isPreview ? `/admin/class/${window._examClassId || ''}` : '/';
    }
}

// ── PostMessage listener ──
window.addEventListener('message', (event) => {
    const msg = event.data;
    if (!msg || typeof msg !== 'object') return;

    switch (msg.type) {
        case 'READY':
            // Exam Pyodide loaded — hide loading screen
            document.getElementById('loading-screen').style.display = 'none';
            break;
        case 'SAVE_DRAFT':
            saveDraft(msg.data);
            break;
        case 'SUBMIT':
            // Accept both naming conventions from exam HTML authors
            submitExam(msg.receipt ?? msg.receipt_json ?? null, msg.score ?? msg.total_score ?? 0);
            break;
    }
});

// ── Main init ──
async function init() {
    try {
        // 1. Get current student info
        document.getElementById('loading-msg').textContent = 'Verificando sesión...';
        const student = await api('/students/me');

        // 2. Get exam status
        document.getElementById('loading-msg').textContent = 'Verificando examen...';
        examStatus = await api(`/students/me/assignments/${assignmentId}/exam-status`);

        isPreview = examStatus.is_preview === true;

        if (isPreview) {
            document.body.classList.add('is-preview');
        }

        // Already submitted? (not shown to teacher in preview)
        if (!isPreview && examStatus.submitted) {
            showStatus('📝', 'Examen ya entregado',
                `Tu calificación: ${examStatus.score ?? '—'} pts. No puedes volver a presentarlo.`);
            return;
        }

        // Not active?
        if (!examStatus.is_active) {
            showStatus('🔒', 'Examen no disponible',
                'Este examen no está activo en este momento. Consulta con tu profesor.');
            return;
        }

        // Time expired? (draft exists but timer ran out)
        if (!isPreview && examStatus.time_remaining_sec !== null && examStatus.time_remaining_sec <= 0) {
            showStatus('⏰', 'Tiempo agotado',
                'El tiempo para este examen ha terminado.');
            return;
        }

        // 3. Fetch exam HTML
        document.getElementById('loading-msg').textContent = 'Descargando examen...';
        const fileResp = await api(`/students/me/assignments/${assignmentId}/exam-file`);
        const examHtmlResp = await fetch(fileResp.presigned_url);
        if (!examHtmlResp.ok) throw new Error('No se pudo descargar el archivo del examen');
        let examHtml = await examHtmlResp.text();

        // 4. Compute time limit (no timer in preview)
        let timeLimit = null;
        if (!isPreview) {
            if (examStatus.time_remaining_sec !== null) {
                timeLimit = examStatus.time_remaining_sec;
            }
        }

        // 5. Prepare auth injection
        const authPayload = {
            token: authToken,
            name: student.name,
            studentId: student.id,
            assignmentId: assignmentId,
            timeLimit: timeLimit,
            draft: isPreview ? null : (examStatus.draft_json || null),
            isPreview: isPreview,
        };

        // Inject __EXAM_AUTH__ before closing </body> tag
        const authScript = `<script>window.__EXAM_AUTH__ = ${JSON.stringify(authPayload)};<\/script>`;
        if (examHtml.includes('</body>')) {
            examHtml = examHtml.replace('</body>', authScript + '\n</body>');
        } else {
            examHtml += '\n' + authScript;
        }

        // 6. Show exam
        const titlePrefix = isPreview ? '👁 Vista Previa' : 'Examen';
        document.getElementById('exam-title-bar').textContent = `${titlePrefix} — ${student.name}`;
        document.getElementById('exam-container').style.display = 'block';
        document.getElementById('loading-msg').textContent = 'Iniciando Pyodide...';

        const iframe = document.getElementById('exam-frame');
        iframe.srcdoc = examHtml;

        // 7. Start timer if applicable (never in preview)
        if (!isPreview && timeLimit !== null && timeLimit > 0) {
            startTimer(timeLimit);
        }

        // Hide loading after a timeout if READY message never comes (fallback)
        setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
        }, 90000); // 90s max wait

    } catch (e) {
        showStatus('❌', 'Error', e.message);
    }
}

init();
</script>
</body>
</html>
