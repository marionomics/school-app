name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: pytest tests -v
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/test

      # The suite builds its schema with create_all, so it never exercises the
      # migration chain. Railway runs `alembic upgrade head` on every boot, so
      # run it here against real PostgreSQL and assert the result matches the
      # models — a broken migration must fail CI, not the deploy.
      - name: Migrations apply cleanly on PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/test
        run: alembic upgrade head

      - name: Migrations match models (no drift)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/test
        run: |
          python - <<'PY'
          import sys
          import sqlalchemy as sa
          from alembic.autogenerate import compare_metadata
          from alembic.migration import MigrationContext
          from app.config import settings
          from app.models import Base

          engine = sa.create_engine(settings.sqlalchemy_url)
          with engine.connect() as conn:
              diff = compare_metadata(MigrationContext.configure(conn), Base.metadata)
          if diff:
              print("Schema drift between migrations and models:")
              for entry in diff:
                  print("  ", entry)
              sys.exit(1)
          print("No drift: migrations match models.")
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
